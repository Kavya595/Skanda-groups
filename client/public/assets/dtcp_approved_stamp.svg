<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="dtcpGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="60%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#ea580c" />
    </radialGradient>
    <linearGradient id="dtcpBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2410c" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Scalloped Gear Ring -->
  <g filter="url(#shadow)">
    <circle cx="100" cy="100" r="92" fill="#0f172a" />
    <circle cx="100" cy="100" r="88" fill="url(#dtcpBorder)" stroke="#f97316" stroke-width="2" />
    <circle cx="100" cy="100" r="82" fill="#090d16" />
  </g>

  <!-- Inner Gold Ribbon Ring -->
  <circle cx="100" cy="100" r="74" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="3,2" />
  <circle cx="100" cy="100" r="69" fill="url(#dtcpGold)" />

  <!-- Outer Ring Text (Circular DTCP Authority) -->
  <path id="textCircleTop" d="M 32,100 A 68,68 0 0,1 168,100" fill="none" />
  <text fill="#ffffff" font-family="'Inter', sans-serif" font-size="8.5" font-weight="800" letter-spacing="2.2">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      DIRECTORATE OF TOWN &amp; COUNTRY PLANNING
    </textPath>
  </text>

  <path id="textCircleBottom" d="M 168,100 A 68,68 0 0,1 32,100" fill="none" />
  <text fill="#f97316" font-family="'Inter', sans-serif" font-size="8.5" font-weight="900" letter-spacing="2">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      GOVT. OF TELANGANA • DTCP
    </textPath>
  </text>

  <!-- Center Shield / Badge -->
  <g transform="translate(100, 100)">
    <!-- Decorative Stars -->
    <polygon points="0,-48 3,-40 11,-40 5,-35 7,-27 0,-32 -7,-27 -5,-35 -11,-40 -3,-40" fill="#c2410c" />
    
    <!-- Central Approval Box -->
    <rect x="-48" y="-22" width="96" height="24" rx="4" fill="#0f172a" stroke="#c2410c" stroke-width="1.5" />
    <text x="0" y="-6" fill="#ffffff" font-family="'Inter', sans-serif" font-size="14" font-weight="900" letter-spacing="1.5" text-anchor="middle">
      DTCP
    </text>

    <!-- Subtext APPROVED -->
    <rect x="-42" y="5" width="84" height="15" rx="3" fill="#ea580c" />
    <text x="0" y="16" fill="#ffffff" font-family="'Inter', sans-serif" font-size="9" font-weight="900" letter-spacing="2" text-anchor="middle">
      APPROVED
    </text>

    <!-- Sanction Order Number -->
    <text x="0" y="32" fill="#0f172a" font-family="'Inter', sans-serif" font-size="7" font-weight="800" letter-spacing="0.5" text-anchor="middle">
      TLP NO. 87/2024/H
    </text>
  </g>
</svg>
